# Docker Build Check: does the production image still build?
#
# Runs on a PR into main or dev, and only when a file that shapes the image changes.
# It never pushes and never logs in. Publishing is docker-build.yml, on a pushed v* tag.
# Why a separate file, and why the path filter: DECISIONS.md D144 in io2p-docs.
#
# Do not make this a required check: a PR that skips it would wait forever.
name: Docker Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - next.config.mjs
      - .github/workflows/docker-check.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
