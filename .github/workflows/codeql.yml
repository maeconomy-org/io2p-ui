# CodeQL: GitHub's static analysis for JavaScript and TypeScript.
#
# Runs: on a PR into main or dev, on every push to main or dev, and weekly, so a new query
# also checks old code.
# Not here: tests and the build are ci.yml. CodeQL reads the source only: no
# install, no build. It is free on public repositories only.
name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, so a newly-published query finds old code without waiting for a commit.
    - cron: '27 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
