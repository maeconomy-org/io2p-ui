# PR gate: typecheck / lint / format / tests / production build.
# Docker publishing lives in docker-build.yml (main + version tags only).
name: ci
on:
  pull_request:
  push:
    branches: [main, dev, refactor/architecture]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:run
      - run: pnpm build
