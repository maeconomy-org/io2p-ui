# CI: the PR gate. Typecheck, lint, format, test, build.
#
# Runs: on every PR, and on every push to main or dev.
# Not here: the image build check is docker-check.yml. Publishing is docker-build.yml.
#
# One job: checks. E2E is not here: it needs a reachable io2p-core, a
# production build made with E2E_KEEP_TEST_IDS=true, and two real accounts.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        # .nvmrc holds the same exact version as the Dockerfile, so the gate runs what ships.
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:run
      - run: pnpm build
