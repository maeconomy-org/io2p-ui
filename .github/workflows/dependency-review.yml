# Dependency Review: fails a PR that adds a dependency with a known vulnerability,
# or one whose licence cannot ship under MIT.
#
# Runs: on every PR. It compares the base with the head, so a push has nothing to
# compare.
# Not here: an audit of the whole lockfile. io2p-ui has no audit job yet.
name: Dependency Review

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences would force the whole project's terms to change.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later
