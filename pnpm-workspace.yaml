# pnpm 11 blocks dependency build scripts by default and, with strictDepBuilds
# (a pnpm 11 default), turns an ignored build into a hard error. The old
# onlyBuiltDependencies list was replaced by the allowBuilds map — each native
# dependency must be explicitly opted in (true) or out (false) here.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  sharp: true

# Supply-chain cooldown: refuse any version published in the last 4320 minutes
# (3 days), stronger than pnpm 11's 1-day default. Excludes our own client and the
# framework packages we bump deliberately.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Listed ahead of publication: io2p-client is a `file:` link today, so the
  # cooldown does not apply yet, but it will the day it lands on a registry —
  # and a 3-day wait on our own client would be a confusing first failure.
  - io2p-client
  - next
  - react
  - react-dom

# Security floor. NOTHING depends on axios today — io2p-client pulls only uuid and
# zod — so this is dormant. Kept so that anything which later drags axios in cannot
# land on a pre-1.17.0 line.
overrides:
  axios@>=1.0.0 <1.17.0: '>=1.17.0'
